set -g status-style "bg=default,fg=#${outline}"
set -g status-left  "#[fg=#${on_primary},bg=#${primary},bold] #S #[fg=#${primary},bg=default,nobold]"
set -g status-right "#{?client_prefix,#[fg=#${primary}]󰘳 ,}#[fg=#${outline}]#{b:pane_current_path} #[fg=#${surface_container_highest}]│#[fg=#${on_surface_variant}] %H:%M "
setw -g window-status-format         "#[fg=#${term8}] #I #W "
setw -g window-status-current-format "#[fg=#${on_surface},bold] #I #W "
setw -g window-status-activity-style "fg=#${primary}"
set -g pane-border-style        "fg=#${surface_container}"
set -g pane-active-border-style "fg=#${primary}"
