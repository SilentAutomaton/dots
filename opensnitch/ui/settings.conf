[General]
statsDialog=1

[auth]
cacert=
cert=
certkey=
type=simple

[database]
file=~/.cache/opensnitch/stats.db
jrnl_wal=false
max_days=7
purge_interval=5
purge_oldest=false
type=1

[global]
default_action=0
default_duration=6
default_ignore_rules=false
default_ignore_temporary_rules=0
default_popup_advanced=false
default_popup_advanced_checksum=false
default_popup_advanced_dstip=false
default_popup_advanced_dstport=false
default_popup_advanced_uid=false
default_popup_position=2
default_target=0
default_timeout=20
disable_popups=false
hide_systray_warning=true
qt_platform_plugin=wayland
screen_scale_factor=1
screen_scale_factor_auto=true
server_address=unix:///run/user/UID/opensnitch-gui.sock
server_max_message_length=4MiB
theme=/usr/lib/python3.14/site-packages/opensnitch/utils/themes/../../themes/dark_white.xml
theme_density_scale=0

[notifications]
enabled=true
type=1

