# ~/.config/tmux/tmux.conf
# Colours come from the palette: theme/apply renders ~/.local/state/theme/tmux.conf.

### Terminal and graphics
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-256color:Tc,xterm-kitty:Tc"
set  -ga terminal-features ",xterm-kitty:RGB:hyperlinks:usstyle"
set  -g  allow-passthrough on          # kitty graphics protocol -> yazi previews
set  -ga update-environment TERM       # yazi must see the real terminal
set  -ga update-environment TERM_PROGRAM
set  -g  set-clipboard on              # OSC52 -> kitty -> wl-clipboard
set  -s  escape-time 10                # Alt bindings do not stall
set  -s  extended-keys on              # CSI u: Shift+Enter and friends reach the app
set  -as terminal-features "xterm-kitty:extkeys"
set  -g  focus-events on
set  -g  history-limit 50000

### Base
set  -g mouse on
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g detach-on-destroy on
setw -g mode-keys vi
set  -g status-keys vi
set  -g display-time 1500
set  -g automatic-rename on
set  -g automatic-rename-format '#{pane_current_command}'
set  -g set-titles on               # forward the pane title out to kitty's own window title
# A running program owns the title through OSC, so live titles keep updating.
# tmux never clears pane_title when that program exits, and it reports the
# hostname when nothing set one, so an idle shell shows the directory instead.
set  -g set-titles-string '#{?#{||:#{==:#{pane_title},#{host_short}},#{==:#{pane_current_command},zsh}},#{b:pane_current_path},#{pane_title}}'

# Sweep a session once its last client leaves it with nothing running.
set-hook -g client-detached "run-shell -b \"~/.config/tmux/scripts/kill-if-idle.sh '#{session_id}'\""

### Prefix
unbind C-b
set -g prefix C-Space
bind C-Space last-window
bind r source-file ~/.config/tmux/tmux.conf \; display " tmux.conf reloaded"

### Alt layer, no prefix - mirrors Hyprland. Alt+/ lists it with notes.
# Alt+Shift is the us/ru layout toggle, so no uppercase Alt bindings here.
# Letters have a Cyrillic twin on the same physical key, so the layer works in both layouts.
bind -n -N "Focus pane left" M-Left select-pane -L
bind -n -N "Focus pane down" M-Down select-pane -D
bind -n -N "Focus pane up" M-Up select-pane -U
bind -n -N "Focus pane right" M-Right select-pane -R
bind -n -N "Focus pane left" M-h select-pane -L
bind -n M-р select-pane -L
bind -n -N "Focus pane down" M-j select-pane -D
bind -n M-о select-pane -D
bind -n -N "Focus pane up" M-k select-pane -U
bind -n M-л select-pane -U
bind -n -N "Focus pane right" M-l select-pane -R
bind -n M-д select-pane -R

bind -n -N "Go to window 1" M-1 select-window -t 1
bind -n -N "Go to window 2" M-2 select-window -t 2
bind -n -N "Go to window 3" M-3 select-window -t 3
bind -n -N "Go to window 4" M-4 select-window -t 4
bind -n -N "Go to window 5" M-5 select-window -t 5
bind -n -N "Go to window 6" M-6 select-window -t 6
bind -n -N "Go to window 7" M-7 select-window -t 7
bind -n -N "Go to window 8" M-8 select-window -t 8
bind -n -N "Go to window 9" M-9 select-window -t 9

bind -n -N "New window" M-t new-window -c "#{pane_current_path}"
bind -n M-е new-window -c "#{pane_current_path}"
bind -n -N "New window, like Super+Return" M-Enter new-window -c "#{pane_current_path}"
bind -n -N "Split pane to the right" M-d split-window -h -c "#{pane_current_path}"
bind -n M-в split-window -h -c "#{pane_current_path}"
bind -n -N "Zoom pane" M-z resize-pane -Z
bind -n M-я resize-pane -Z
bind -n -N "Next window" M-n next-window
bind -n M-т next-window
bind -n -N "Previous window" M-p previous-window
bind -n M-з previous-window
bind -n -N "Narrow pane" 'M-;' resize-pane -L 3
bind -n M-ж resize-pane -L 3
bind -n -N "Widen pane" "M-'" resize-pane -R 3
bind -n M-э resize-pane -R 3
bind -n -N "Yazi popup" M-e display-popup -E -w 90% -h 85% -d "#{pane_current_path}" yazi
bind -n M-у display-popup -E -w 90% -h 85% -d "#{pane_current_path}" yazi
bind -n -N "Lazygit popup" M-g display-popup -E -w 90% -h 85% -d "#{pane_current_path}" lazygit
bind -n M-п display-popup -E -w 90% -h 85% -d "#{pane_current_path}" lazygit
bind -n -N "Close pane (asks when busy)" M-q if -F "#{==:#{pane_current_command},zsh}" kill-pane "confirm-before -p 'kill busy pane #P? (y/n)' kill-pane"
bind -n M-й if -F "#{==:#{pane_current_command},zsh}" kill-pane "confirm-before -p 'kill busy pane #P? (y/n)' kill-pane"

# Alt+Ctrl moves things: arrows swap the pane with its neighbour, digits send it to window N.
bind -n -N "Move pane left" C-M-Left "swap-pane -t '{left-of}' ; select-pane -t '{left-of}'"
bind -n -N "Move pane down" C-M-Down "swap-pane -t '{down-of}' ; select-pane -t '{down-of}'"
bind -n -N "Move pane up" C-M-Up "swap-pane -t '{up-of}' ; select-pane -t '{up-of}'"
bind -n -N "Move pane right" C-M-Right "swap-pane -t '{right-of}' ; select-pane -t '{right-of}'"
bind -n -N "Send pane to window 1" C-M-1 "run-shell \"tmux join-pane -t :1 2>/dev/null || tmux break-pane -t :1\""
bind -n -N "Send pane to window 2" C-M-2 "run-shell \"tmux join-pane -t :2 2>/dev/null || tmux break-pane -t :2\""
bind -n -N "Send pane to window 3" C-M-3 "run-shell \"tmux join-pane -t :3 2>/dev/null || tmux break-pane -t :3\""
bind -n -N "Send pane to window 4" C-M-4 "run-shell \"tmux join-pane -t :4 2>/dev/null || tmux break-pane -t :4\""
bind -n -N "Send pane to window 5" C-M-5 "run-shell \"tmux join-pane -t :5 2>/dev/null || tmux break-pane -t :5\""
bind -n -N "Send pane to window 6" C-M-6 "run-shell \"tmux join-pane -t :6 2>/dev/null || tmux break-pane -t :6\""
bind -n -N "Send pane to window 7" C-M-7 "run-shell \"tmux join-pane -t :7 2>/dev/null || tmux break-pane -t :7\""
bind -n -N "Send pane to window 8" C-M-8 "run-shell \"tmux join-pane -t :8 2>/dev/null || tmux break-pane -t :8\""
bind -n -N "Send pane to window 9" C-M-9 "run-shell \"tmux join-pane -t :9 2>/dev/null || tmux break-pane -t :9\""

bind -n -N "Key help" M-/ display-popup -E -w 70% -h 85% "{ cat ~/.config/tmux/keys-legend.txt; tmux list-keys -N -P '' -T root; } | less -R"
bind -n -N "Key help" M-F1 display-popup -E -w 70% -h 85% "{ cat ~/.config/tmux/keys-legend.txt; tmux list-keys -N -P '' -T root; } | less -R"

### Prefix layer
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"
bind -r H resize-pane -L 3
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 3
bind s choose-tree -Zs
bind w choose-tree -Zw
bind Q kill-window
bind , command-prompt -I "#W" "rename-window '%%'"
bind '$' command-prompt -I "#S" "rename-session '%%'"

### Copy mode. kitty grabs PageUp/PageDown, so scroll with C-u / C-d or the wheel.
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'wl-copy'
bind p paste-buffer -p

### Look. bg=default keeps kitty background_opacity 0.95 visible.
source-file ~/.local/state/theme/tmux.conf
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
setw -g window-status-separator ""

set -g pane-border-lines single
set -g popup-border-lines rounded          # echoes Hyprland rounding = 18

### Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
run '~/.config/tmux/plugins/tpm/tpm'
