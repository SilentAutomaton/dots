# ~/.config/tmux/tmux.conf
# Colours come from the palette: theme/apply renders ~/.local/state/theme/tmux.conf.

### Terminal and graphics
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-256color:Tc,xterm-kitty:Tc"
set  -ga terminal-features ",xterm-kitty:RGB:hyperlinks:usstyle"
set  -g  allow-passthrough on          # kitty graphics protocol -> yazi previews
set  -ga update-environment TERM       # yazi must see the real terminal
set  -ga update-environment TERM_PROGRAM
set  -g  set-clipboard on              # OSC52 -> kitty -> wl-clipboard
set  -s  escape-time 10                # Alt bindings do not stall
set  -s  extended-keys on              # CSI u: Shift+Enter and friends reach the app
set  -as terminal-features "xterm-kitty:extkeys"
set  -g  focus-events on
set  -g  history-limit 50000

### Base
set  -g mouse on
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g detach-on-destroy on
setw -g mode-keys vi
set  -g status-keys vi
set  -g display-time 1500
set  -g automatic-rename on
set  -g automatic-rename-format '#{pane_current_command}'
set  -g set-titles on               # forward the pane title out to kitty's own window title
# A running program owns the title through OSC, so live titles keep updating.
# tmux never clears pane_title when that program exits, and it reports the
# hostname when nothing set one, so an idle shell shows the directory instead.
set  -g set-titles-string '#{?#{||:#{==:#{pane_title},#{host_short}},#{==:#{pane_current_command},zsh}},#{b:pane_current_path},#{pane_title}}'

# Sweep a session once its last client leaves it with nothing running.
set-hook -g client-detached "run-shell -b \"~/.config/tmux/scripts/kill-if-idle.sh '#{session_id}'\""

### Prefix
unbind C-b
set -g prefix C-Space
bind C-Space last-window
bind r source-file ~/.config/tmux/tmux.conf \; display " tmux.conf reloaded"

### Alt layer, no prefix - mirrors Hyprland.
# Alt+Shift is the us/ru layout toggle, so no uppercase Alt bindings here.
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-d split-window -h -c "#{pane_current_path}"
bind -n M-z resize-pane -Z
bind -n M-n next-window
bind -n M-p previous-window
bind -n 'M-;' resize-pane -L 3
bind -n "M-'" resize-pane -R 3
bind -n M-e display-popup -E -w 90% -h 85% -d "#{pane_current_path}" yazi
bind -n M-g display-popup -E -w 90% -h 85% -d "#{pane_current_path}" lazygit

### Prefix layer
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"
bind -r H resize-pane -L 3
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 3
bind s choose-tree -Zs
bind w choose-tree -Zw
bind Q kill-window
bind , command-prompt -I "#W" "rename-window '%%'"
bind '$' command-prompt -I "#S" "rename-session '%%'"

### Copy mode. kitty grabs PageUp/PageDown, so scroll with C-u / C-d or the wheel.
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'wl-copy'
bind p paste-buffer -p

### Look. bg=default keeps kitty background_opacity 0.95 visible.
source-file ~/.local/state/theme/tmux.conf
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
setw -g window-status-separator ""

set -g pane-border-lines single
set -g popup-border-lines rounded          # echoes Hyprland rounding = 18

### Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
run '~/.config/tmux/plugins/tpm/tpm'
