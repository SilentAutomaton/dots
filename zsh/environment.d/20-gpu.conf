# Hyprland drives the screens on the Intel card only. It opens every GPU it
# finds otherwise, and that keeps the NVIDIA card awake for the whole session.
# Games and CUDA still reach NVIDIA through prime-run. HDMI and DP-3 are wired
# to NVIDIA, so they stay dark: delete this line and log in again to use them.
# It has to be here, not in the Hyprland config: the GPUs are opened before the
# config is read.
AQ_DRM_DEVICES=/dev/dri/intel-igpu
