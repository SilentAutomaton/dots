# Keep $HOME clean: point tools at XDG locations instead of ~/.<tool>
# Read by systemd --user at login, so every app started from the session sees it.

XDG_CONFIG_HOME=$HOME/.config
XDG_DATA_HOME=$HOME/.local/share
XDG_STATE_HOME=$HOME/.local/state
XDG_CACHE_HOME=$HOME/.cache

# toolchains
CARGO_HOME=$XDG_DATA_HOME/cargo
RUSTUP_HOME=$XDG_DATA_HOME/rustup
GOPATH=$XDG_DATA_HOME/go
GOMODCACHE=$XDG_CACHE_HOME/go/mod
PYENV_ROOT=$XDG_DATA_HOME/pyenv
NVM_DIR=$XDG_DATA_HOME/nvm
BUN_INSTALL=$XDG_DATA_HOME/bun
PUB_CACHE=$XDG_DATA_HOME/pub-cache
DOTNET_CLI_HOME=$XDG_DATA_HOME/dotnet
GRADLE_USER_HOME=$XDG_DATA_HOME/gradle
ANDROID_HOME=$XDG_DATA_HOME/android-sdk
ANDROID_SDK_ROOT=$XDG_DATA_HOME/android-sdk
ANDROID_USER_HOME=$XDG_DATA_HOME/android

# package managers
npm_config_cache=$XDG_CACHE_HOME/npm
npm_config_prefix=$HOME/.local

# apps
DOCKER_CONFIG=$XDG_CONFIG_HOME/docker
CODEX_HOME=$XDG_CONFIG_HOME/codex
ELECTRUMDIR=$XDG_DATA_HOME/electrum
WINEPREFIX=$XDG_DATA_HOME/wine
__GL_SHADER_DISK_CACHE_PATH=$XDG_CACHE_HOME/nv

# stray history and state files
LESSHISTFILE=$XDG_STATE_HOME/less_history
NODE_REPL_HISTORY=$XDG_STATE_HOME/node_repl_history
WGETRC=$XDG_CONFIG_HOME/wget/wgetrc
NLTK_DATA=$XDG_DATA_HOME/nltk_data
GTK2_RC_FILES=$XDG_CONFIG_HOME/gtk-2.0/gtkrc
ALSOFT_CONF=$XDG_CONFIG_HOME/alsoft.conf
YARN_RC_FILENAME=$XDG_CONFIG_HOME/yarn/config
MODELSCOPE_CACHE=$XDG_CACHE_HOME/modelscope
CLAUDE_CONFIG_DIR=$XDG_CONFIG_HOME/claude
DUCKDB_HISTORY=$XDG_STATE_HOME/duckdb_history
