font_family      family="GeistMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

background_opacity 0.95
window_padding_width 6
confirm_os_window_close 0
scrollback_lines 5000

include ~/.local/state/theme/kitty.conf

shell /usr/bin/zsh
enable_audio_bell no
# TERM stays xterm-kitty: image.nvim needs the kitty graphics protocol, and
# xterm-256color would break inline images in neovim.

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection

map ctrl+0     change_font_size all 0
map ctrl+equal change_font_size all +1.0
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

map f11 toggle_fullscreen

# Only reaches kitty when the running program ignores PageUp/PageDown.
map page_up    scroll_page_up
map page_down  scroll_page_down
map shift+home scroll_home
map shift+end  scroll_end

# Passes Shift+Enter through to the program (kitty keyboard protocol).
map shift+enter send_text all \x1b[13;2u
